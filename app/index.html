<style>
:root{--bg:#13120f;--card:#1c1a16;--line:#34302a;--rail:#4a453c;--tx:#efe9dc;--tx2:#d9d2c3;--mut:#a39c8c;--amber:#e9a23b;--verm:#e2553a;--up:#7cc4a4;--down:#e07b53;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.45}
body{overscroll-behavior-y:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:560px;margin:0 auto;padding:calc(18px + var(--safe-t)) 20px calc(110px + var(--safe-b))}
.k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.mono{font-family:var(--mono)}
.mut{color:var(--mut)}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.015em}
h1{font-size:30px;line-height:1.12}
h2{font-size:23px;line-height:1.2}
h3{font-size:20px;line-height:1.2}
p{margin:0}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top .date{margin-left:auto}
.back{width:44px;height:44px;margin-left:-12px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0}
.star{width:44px;height:44px;margin-left:auto;background:none;border:0;font-size:22px;color:var(--mut);padding:0}
.star.on{color:var(--amber)}
.sec{margin-top:26px}
.strip{margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip>div{padding:10px 0 10px 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.strip>div:first-child{padding-left:0;border-left:0}
.strip .l{font-size:11px;color:var(--mut)}
.strip .v{font-family:var(--mono);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .n{font-size:10px;color:var(--mut)}
.card{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--card);border-radius:16px;margin-top:10px}
.row1{display:flex;align-items:baseline;gap:8px;min-width:0}
.row1 .nm{font-family:var(--serif);font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.meta .cnt{margin-left:auto;display:flex;gap:10px;font-family:var(--mono)}
.ok{color:var(--up)}.watch{color:var(--amber)}.ko{color:var(--verm)}.nc{color:var(--mut)}
.upc{color:var(--up)}.dnc{color:var(--down)}
.bar{position:relative;height:16px}
.bar .r{position:absolute;left:0;right:0;top:7px;height:2px;background:var(--rail)}
.bar .z{position:absolute;top:2px;height:12px;background:repeating-linear-gradient(135deg,var(--amber) 0 2px,transparent 2px 6px)}
.bar .d{position:absolute;top:1px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--tx);box-shadow:0 0 0 3px var(--card)}
.bare .d{box-shadow:0 0 0 3px var(--bg)}
.legs{display:flex;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--mut)}
.list>*{padding:12px 0;border-top:1px solid var(--line)}
.list>*:last-child{border-bottom:1px solid var(--line)}
.li{display:flex;gap:12px;align-items:baseline}
.li .tag{font-family:var(--mono);font-size:12px;width:44px;flex-shrink:0}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:baseline}
.vrow .nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .px{font-family:var(--mono);font-size:14px;text-align:right}
.vrow .sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pill{font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:20px}

.grid3>div:first-child{padding-left:0;border-left:0}

.th{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px}

.th .r{font-size:13px;color:var(--tx2);margin-top:4px}

.th .nx{font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:4px}

.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:none;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:500}
.seg{height:6px;display:flex;gap:3px;margin-top:12px}
.seg i{border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 0;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-weight:400}
th:first-child,td:first-child{text-align:left;font-family:var(--sans);color:var(--mut)}
thead th{color:var(--mut);font-size:11px}
.cmp td.best{color:var(--up)}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mut)}
.field{min-width:0}.field input,.field select,.field textarea{width:100%;max-width:100%;box-sizing:border-box;min-height:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--tx);font-size:16px}
textarea{resize:vertical;min-height:90px}
.form{display:grid;gap:10px;margin-top:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(19,18,15,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 8px calc(10px + var(--safe-b))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);min-height:48px;justify-content:center}
nav.tabs a.on{color:var(--tx)}
svg.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6}
.chart{position:relative;margin-top:14px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.read{font-family:var(--mono);font-size:12px;color:var(--mut);min-height:18px;margin-top:4px}
.empty{padding:16px;border:1px dashed var(--line);border-radius:14px;color:var(--mut);font-size:14px;margin-top:10px}
.foot{margin-top:32px;font-size:11px;color:var(--mut);line-height:1.5}
.load{display:flex;height:70vh;align-items:center;justify-content:center;color:var(--mut)}
.x{background:none;border:0;color:var(--mut);min-width:44px;min-height:44px}
</style>
</head>
<body>
<main id="app"><div class="load">Chargement…</div></main>
<nav class="tabs" aria-label="Navigation"><div class="in" id="tabs"></div></nav>
<script>
"use strict";
/* ---------- Petites aides ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=(n,d=2)=>n==null||isNaN(n)?"–":Number(n).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(n,d=1)=>n==null||isNaN(n)?"–":(n>0?"+":n<0?"−":"")+nf(Math.abs(n),d)+" %";
const cls=n=>n==null?"":n>0?"upc":n<0?"dnc":"";
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const dFR=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"";
const today=new Date();
const daysTo=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s))return null;const t=new Date(s+"T12:00:00");return Math.round((t-today)/864e5)};
const ICON={
 jour:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>',
 val:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/></svg>',
 monde:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16"/></svg>',
 cmp:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 20V9M12 20V4M18 20v-7"/></svg>',
 carnet:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 3h11a1 1 0 0 1 1 1v16l-3-2-3 2-3-2-3 2V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h6"/></svg>',
 back:'<svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>'};
const LOGO='<img src="mark.png" alt="" width="36" height="23" style="display:block">';

/* ---------- Données ---------- */
let APP=null, PX=null, V={};
const favs=()=>store.get("sat.favs",[]);
function toggleFav(t){let f=favs();f=f.includes(t)?f.filter(x=>x!==t):[...f,t];store.set("sat.favs",f);render()}
function price(v){const s=PX?.series?.[v.ticker];return s?.dernier??v.analyse?.tech?.cours??v.cours}
function priceDate(v){const s=PX?.series?.[v.ticker];return s?.dernierLe??v.coursLe}
const HC={};function histo(v){if(HC[v.ticker])return HC[v.ticker];const h=(PX?.series?.[v.ticker]?.histo||[]).map(p=>[/^\d{4}-/.test(p[0])?p[0].slice(8,10)+"/"+p[0].slice(5,7)+"/"+p[0].slice(2,4):p[0],p[1]]);return HC[v.ticker]=h}
function varJour(v){const h=histo(v);if(h.length<2)return null;return (h[h.length-1][1]/h[h.length-2][1]-1)*100}
function perf(v,k){const s=PX?.series?.[v.ticker];const m={m1:"perf1m",m3:"perf3m",m12:"perf12m"}[k];return s?.[m]??v.perf?.[k]}
function hi52(v){return PX?.series?.[v.ticker]?.haut52??v.analyse?.tech?.haut52}
function lo52(v){return PX?.series?.[v.ticker]?.bas52??v.analyse?.tech?.bas52}
function zoneOf(v){const m=(v.analyse?.zones?.interet||"").replace(/(\d)\s(\d)/g,"$1$2").replace(/,/g,".").match(/(\d+(?:\.\d+)?)\s*(?:€|NOK|\$)?\s*(?:à|-|et)\s*(\d+(?:\.\d+)?)/);if(!m)return null;const a=+m[1],b=+m[2],px=price(v);if(!px||a<px*.4||b>px*2.5)return null;return [Math.min(a,b),Math.max(a,b)]}
function zoneTxt(v){const z=zoneOf(v),px=price(v);if(!z||!px)return "";if(px>=z[0]&&px<=z[1])return "dans sa zone d'intérêt";return px>z[1]?nf((px/z[1]-1)*100,1)+" % au-dessus de sa zone":nf((1-px/z[0])*100,1)+" % sous sa zone"}
function suivi(v){const s=v.societe?.suivi;if(!s)return {items:[],n:{ok:0,watch:0,ko:0,nc:0}};const items=[...(s.croire||[]).map(x=>({...x,t:x.c,kind:"croire"})),...(s.questions||[]).map(x=>({...x,t:x.q,kind:"question"}))];const n={ok:0,watch:0,ko:0,nc:0};items.forEach(i=>n[i.etat]!=null&&n[i.etat]++);return {items,n,bilan:s.bilan,le:s.le}}
const SYM={ok:"✓",watch:"⚠",ko:"✗",nc:"?"};
function counts(v){const {n}=suivi(v);return ["ok","watch","ko","nc"].filter(k=>n[k]||k==="ok"||k==="watch").map(k=>`<span class="${k}">${SYM[k]} ${n[k]}</span>`).join("")}
function barHTML(v,bare){const lo=lo52(v),hi=hi52(v),px=price(v);if(lo==null||hi==null||!(hi>lo)||px==null)return "";const P=x=>Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100));const z=zoneOf(v);const zb=z?`<div class="z" style="left:${P(z[0])}%;width:${Math.max(1.5,P(z[1])-P(z[0]))}%"></div>`:"";return `<div class="bar ${bare?"bare":""}" role="img" aria-label="Cours ${nf(px)} entre le plus bas ${nf(lo)} et le plus haut ${nf(hi)} sur un an"><div class="r"></div>${zb}<div class="d" style="left:${P(px)}%"></div></div>`}
const dev=v=>v.devise||"€";
const place=v=>({IT:"Milan",FR:"Paris",DE:"Francfort",ES:"Madrid",NL:"Amsterdam",BE:"Bruxelles",NO:"Oslo",FI:"Helsinki",SE:"Stockholm",DK:"Copenhague",CH:"Zurich",US:"New York",GB:"Londres"}[v.pays]||v.pays||"");

/* ---------- Graphique ---------- */
function chartSVG(series,opt={}){ // series: [{pts:[[label,y]],color}]
 const W=opt.w||346,H=opt.h||160,pt=8,pb=20;
 let ys=[];series.forEach(s=>s.pts.forEach(p=>ys.push(p[1])));if(opt.zone)ys.push(...opt.zone);if(opt.base!=null)ys.push(opt.base);
 if(!ys.length)return "";
 let lo=Math.min(...ys),hi=Math.max(...ys);const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;
 const n=Math.max(...series.map(s=>s.pts.length));const X=i=>i/Math.max(1,n-1)*W,Y=y=>pt+(1-(y-lo)/(hi-lo))*(H-pt-pb);
 let g="";
 if(opt.zone){const a=Y(Math.min(hi,opt.zone[1])),b=Y(Math.max(lo,opt.zone[0]));g+=`<rect x="0" width="${W}" y="${a}" height="${Math.max(2,b-a)}" fill="#e9a23b" opacity=".14"/><line x1="0" x2="${W}" y1="${a}" y2="${a}" stroke="#e9a23b" stroke-opacity=".5" stroke-dasharray="2 4"/><line x1="0" x2="${W}" y1="${b}" y2="${b}" stroke="#e9a23b" stroke-opacity=".5" stroke-dasharray="2 4"/>`}
 if(opt.base!=null)g+=`<line x1="0" x2="${W}" y1="${Y(opt.base)}" y2="${Y(opt.base)}" stroke="#4a453c" stroke-dasharray="2 4"/>`;
 series.forEach(s=>{g+=`<polyline fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round" points="${s.pts.map((p,i)=>X(i).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"/>`;const l=s.pts[s.pts.length-1];if(l&&!opt.noDot)g+=`<circle cx="${X(s.pts.length-1)}" cy="${Y(l[1])}" r="4.5" fill="${s.color}" stroke="#13120f" stroke-width="2"/>`});
 const p0=series[0].pts;g+=`<text x="0" y="${H-4}" fill="#a39c8c" font-family="Geist Mono" font-size="10">${esc(p0[0]?.[0]||"")}</text><text x="${W}" y="${H-4}" fill="#a39c8c" font-family="Geist Mono" font-size="10" text-anchor="end">${esc(p0[p0.length-1]?.[0]||"")}</text>`;
 g+=`<line class="cur" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#efe9dc" stroke-opacity=".35" visibility="hidden"/>`;
 return `<svg viewBox="0 0 ${W} ${H}" data-n="${n}" data-w="${W}">${g}</svg>`}
function wireScrub(box,series,fmt){const svg=box.querySelector("svg"),rd=box.nextElementSibling;if(!svg)return;const n=+svg.dataset.n,W=+svg.dataset.w,cur=svg.querySelector(".cur");const def=rd.innerHTML;
 const at=e=>{const r=svg.getBoundingClientRect();const x=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width;const i=Math.max(0,Math.min(n-1,Math.round(x*(n-1))));cur.setAttribute("x1",i/(n-1)*W);cur.setAttribute("x2",i/(n-1)*W);cur.setAttribute("visibility","visible");rd.innerHTML=fmt(i)};
 const end=()=>{cur.setAttribute("visibility","hidden");rd.innerHTML=def};
 box.addEventListener("pointermove",at);box.addEventListener("touchmove",at,{passive:true});box.addEventListener("pointerleave",end);box.addEventListener("touchend",end)}
const PER={"1M":21,"3M":63,"6M":126,"1A":260};


function spark(pts,w=86,h=26){if(!pts||pts.length<2)return "";const ys=pts.map(p=>p[1]);const lo=Math.min(...ys),hi=Math.max(...ys)||1;const X=i=>i/(pts.length-1)*w,Y=y=>2+(1-(y-lo)/((hi-lo)||1))*(h-4);const up=ys[ys.length-1]>=ys[0];return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="display:block"><polyline fill="none" stroke="${up?"#7cc4a4":"#e07b53"}" stroke-width="1.5" stroke-linejoin="round" points="${pts.map((p,i)=>X(i).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"/></svg>`}
function barsHTML(rows,key,fmt,color){const r=rows.filter(x=>x[key]!=null);if(!r.length)return "";const mx=Math.max(...r.map(x=>Math.abs(x[key])))||1;return `<div style="display:flex;align-items:flex-end;gap:6px;height:118px;margin-top:10px">${r.map(x=>{const e=/e/i.test(String(x.annee));const h=Math.max(3,Math.abs(x[key])/mx*84);return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0"><span class="mono" style="font-size:10px;color:var(--tx2);white-space:nowrap">${fmt(x[key])}</span><div style="width:100%;max-width:34px;height:${h}px;border-radius:4px 4px 0 0;background:${e?"transparent":color};border:1px ${e?"dashed":"solid"} ${color}"></div><span class="mono mut" style="font-size:10px">${esc(String(x.annee).replace("20",""))}</span></div>`}).join("")}</div>`}
let fanM=12,fanSel="central",simX=store.get("sat.simx",1000);
function fanVals(v){const px=price(v),S=v.analyse?.scenarios||[],s2=S.find(s=>s.horizon==="2 mois"),s12=S.find(s=>s.horizon==="12 mois");if(px==null||!s2||!s12||[s2.bas,s2.haut,s12.bas,s12.haut,s12.central,s2.central].some(x=>x==null))return null;return {px,s2,s12}}
function interp(F,k,m){return m<=2?F.px+(F.s2[k]-F.px)*m/2:F.s2[k]+(F.s12[k]-F.s2[k])*(m-2)/10}
function fanSVG(v){const F=fanVals(v);if(!F)return "";const {px,s2,s12}=F,vals=[px,s2.bas,s2.haut,s12.bas,s12.haut];const lo=Math.min(...vals)*.97,hi=Math.max(...vals)*1.03;const W=346,H=190,pl=34,pr=6,pt=8,pb=20,X=m=>pl+m/12*(W-pl-pr),Y=y=>pt+(1-(y-lo)/(hi-lo))*(H-pt-pb);
 const pts=k=>`${X(0)},${Y(px)} ${X(2)},${Y(s2[k])} ${X(12)},${Y(s12[k])}`;const area=`${X(0)},${Y(px)} ${X(2)},${Y(s2.haut)} ${X(12)},${Y(s12.haut)} ${X(12)},${Y(s12.bas)} ${X(2)},${Y(s2.bas)}`;
 const ticks=[lo,(lo+hi)/2,hi].map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#34302a"/><text x="${pl-4}" y="${Y(t)+3}" text-anchor="end" fill="#a39c8c" font-family="Geist Mono" font-size="9">${nf(t,0)}</text>`).join("");
