name: Cours du soir
on:
  schedule:
    - cron: "35 16 * * 1-5"   # 18h35 à Paris l'été, 17h35 l'hiver (après la clôture)
    - cron: "10 18 * * 1-5"   # deuxième passage de secours
    - cron: "40 20 * * 1-5"   # troisième passage (clôture américaine)
  workflow_dispatch: {}        # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
jobs:
  prix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance
      - run: python prix.py
      - name: Enregistrer les données
        run: |
          git config user.name "terminal-bot"
          git config user.email "terminal-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || git commit -m "Cours du $(date -u +%F)"
          git push
